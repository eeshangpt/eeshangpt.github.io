d.dataset.theme=t;d.classList.add("js");
document.addEventListener("DOMContentLoaded",function(){var b=document.querySelector(".theme-toggle");
function s(){var n=d.dataset.theme==="light"?"dark":"light";b.textContent=n[0].toUpperCase()+n.slice(1);b.setAttribute("aria-label","Switch to "+n+" theme")}
s();b.hidden=false;
b.onclick=function(){var n=d.dataset.theme==="light"?"dark":"light";d.dataset.theme=n;try{localStorage.setItem("theme",n)}catch(e){}s()}})})();
</script>
